version: '3.8'
services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=microwiki
      - POSTGRES_USER=wikiuser
      - POSTGRES_PASSWORD=wikipass
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - USE_POSTGRES=True
      - POSTGRES_DB=microwiki
      - POSTGRES_USER=wikiuser
      - POSTGRES_PASSWORD=wikipass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      - db

volumes:
  postgres_data:
