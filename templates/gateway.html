<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Seguro | Micro-Wiki</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="login-body">
    {% include 'loader.html' %}
    <div class="gateway-container">
        <div class="login-header">
            <h2>Gateway da Empresa</h2>
            <p>Identifique sua organização para prosseguir</p>
        </div>
        
        {% if error %}
        <div class="login-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{% url 'gateway' %}" autocomplete="off">
            {% csrf_token %}
            <div class="form-group">
                <div class="input-wrapper">
                    <span class="input-icon"><svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg></span>
                    <input type="text" name="company_code" placeholder="Código ou Domínio da Empresa" required style="font-size: 1.1rem; padding-left: 40px; height: 50px;" autocomplete="off">
                </div>
            </div>
            <button type="submit" class="btn-primary btn-block" style="height: 50px;">Avançar</button>
        </form>
    </div>
</body>
</html>
